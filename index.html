<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Minecraft Progression Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0a0a0c;
    --panel: #15161a;
    --panel-2: #1b1c21;
    --border: #2c2d33;
    --border-hover: #45474f;
    --text: #eaeaec;
    --text-dim: #9a9aa2;
    --text-faint: #5c5d64;
    --accent: #ff9f43;
    --accent-2: #4ade80;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --ctrl-h: 36px;
    --shadow-panel: 0 14px 34px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.35);
    --font-ui: 'Reddit Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    /* the map reads like a small island of nodes floating in a dark void:
       a broad, soft dark ellipse pools like a shadow beneath it on the
       "ground", inside the same vignette-y glow around the whole scene */
    background:
      radial-gradient(ellipse 62% 30% at 50% 74%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 72%),
      radial-gradient(ellipse at 50% 38%, #16171c 0%, #101114 45%, var(--bg) 80%);
    margin: 0; padding: 0;
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    color: var(--text); overflow: hidden;
  }
  #cy { width: 100vw; height: 100vh; display: block; }

  /* thin, dark, unobtrusive scrollbars on every scrollable panel */
  #details-pane-scroll::-webkit-scrollbar, #timeline-scroll::-webkit-scrollbar { width: 8px; }
  #details-pane-scroll::-webkit-scrollbar-track, #timeline-scroll::-webkit-scrollbar-track { background: transparent; }
  #details-pane-scroll::-webkit-scrollbar-thumb, #timeline-scroll::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 4px;
  }
  #details-pane-scroll::-webkit-scrollbar-thumb:hover, #timeline-scroll::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  #top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 18px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(6,6,8,0.75) 0%, rgba(6,6,8,0.0) 100%);
  }
  #title-box { pointer-events: auto; }
  #title-box h1 {
    margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--text);
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }
  #title-box .subtitle {
    font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.07em;
    text-transform: uppercase; margin-top: 2px;
  }

  #search-box {
    pointer-events: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-md); height: var(--ctrl-h); padding: 0 14px;
    display: flex; align-items: center; gap: 9px;
    box-shadow: var(--shadow-panel);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search-box:focus-within { border-color: var(--accent); box-shadow: var(--shadow-panel), 0 0 0 3px rgba(255,159,67,0.14); }
  #search-box .search-icon { color: var(--text-faint); font-size: 14px; line-height: 1; }
  #search-box input {
    background: transparent; border: none; outline: none; color: var(--text);
    font-family: var(--font-ui); font-weight: 600; font-size: 13px; width: 190px;
  }
  #search-box input::placeholder { color: var(--text-faint); }

  @media (max-width: 520px) {
    #search-box input { width: 120px; }
    #title-box h1 { font-size: 16px; }
  }

  #top-right-controls {
    position: relative; display: flex; align-items: center; gap: 9px; pointer-events: none;
    flex-wrap: wrap; justify-content: flex-end;
  }
  #top-right-controls > * { pointer-events: auto; }

  #menu-button {
    position: relative;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-md); width: var(--ctrl-h); height: var(--ctrl-h);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-panel); cursor: pointer;
    transition: border-color 0.15s ease, background 0.12s ease;
  }
  #menu-button:hover { border-color: var(--border-hover); background: var(--panel-2); }
  #menu-button.active { border-color: var(--accent); color: var(--accent); }
  #menu-button .menu-icon { font-size: 15px; color: var(--text-dim); line-height: 1; }
  #menu-button.active .menu-icon { color: var(--accent); }

  #menu-dropdown {
    position: absolute; top: calc(100% + 10px); right: 0; min-width: 190px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-panel); padding: 6px;
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 1002;
  }
  #menu-dropdown.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #menu-dropdown .menu-item {
    padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
    color: var(--text-dim); cursor: pointer; transition: background 0.12s ease, color 0.12s ease;
  }
  #menu-dropdown .menu-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  #menu-dropdown .menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
  #menu-dropdown .menu-credit {
    padding: 7px 10px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em;
    color: var(--text-faint); text-transform: uppercase;
  }

  #details-pane {
    position: absolute; top: 78px; right: 14px; width: 300px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-panel);
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-height: 70vh; overflow: hidden;
    z-index: 1001;
  }
  #details-pane-scroll { padding: 18px 20px; max-height: 70vh; overflow-y: auto; }
  #details-pane.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #details-pane .pane-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  #details-pane img {
    width: 44px; height: 44px; image-rendering: pixelated; flex-shrink: 0;
    background: #0d0d10; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px;
  }
  #details-pane h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.005em; }
  #details-pane .tier-tag {
    display: inline-block; margin-top: 5px; font-size: 10.5px;
    letter-spacing: 0.03em; padding: 2px 9px; border-radius: 999px; color: #0d0d0d; font-weight: 700;
  }
  #details-pane p.desc { font-size: 13.5px; line-height: 1.55; color: var(--text-dim); margin: 12px 0 12px; }
  #details-pane .rel-title {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; color: var(--text-faint); margin: 12px 0 5px;
    text-transform: uppercase; border-top: 1px solid var(--border); padding-top: 11px;
  }
  #details-pane .rel-list { font-size: 13px; line-height: 1.55; color: #b7b7bd; }
  #details-pane .rel-list span.arrow { margin-right: 5px; font-weight: 700; }
  #details-pane .rel-list span.arrow.req { color: var(--accent); }
  #details-pane .rel-list span.arrow.unlock { color: var(--accent-2); }
  #details-pane .dbl-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  #details-pane .close-btn, #timeline-panel .close-btn {
    position: absolute; top: 12px; right: 12px; cursor: pointer; color: var(--text-faint); font-size: 16px;
    pointer-events: auto; font-family: var(--font-ui); font-weight: 500; line-height: 1;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); transition: color 0.12s ease, background 0.12s ease;
  }
  #details-pane .close-btn:hover, #timeline-panel .close-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  #timeline-panel {
    position: absolute; top: 78px; left: 14px; width: 280px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-panel);
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-height: 76vh; overflow: hidden;
    z-index: 1001;
  }
  #timeline-scroll { padding: 16px 18px; max-height: 76vh; overflow-y: auto; }
  #timeline-panel.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #timeline-panel h4 { margin: 0 0 12px; font-size: 14.5px; font-weight: 700; color: var(--accent); letter-spacing: -0.005em; }
  .tl-step { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .tl-step:last-child { border-bottom: none; }
  .tl-step .tl-num {
    width: 19px; height: 19px; flex-shrink: 0; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--text-dim);
  }
  .tl-step img { width: 26px; height: 26px; image-rendering: pixelated; flex-shrink: 0; }
  .tl-step .tl-label { font-size: 13px; font-weight: 500; color: #ccc; }
  .tl-step.tl-target .tl-label { color: var(--accent); font-weight: 600; }


  #legend {
    position: absolute; bottom: 18px; right: 14px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-md); height: var(--ctrl-h); padding: 0 14px;
    display: flex; align-items: center;
    box-shadow: var(--shadow-panel);
    font-size: 13px; font-weight: 600; font-family: var(--font-ui);
    max-height: var(--ctrl-h); overflow: hidden; cursor: pointer;
    transition: max-height 0.2s ease, height 0.2s ease, padding 0.2s ease;
  }
  #legend-grid { display: none; grid-template-columns: 1fr 1fr; gap: 6px 18px; padding: 10px 0 3px; font-weight: 500; }
  #legend-header {
    font-size: 13px; font-weight: 600; letter-spacing: 0.005em;
    color: var(--text); white-space: nowrap;
  }
  /* resting state is a compact "Tiers" tab the same height as the Fit View
     button; hovering it reopens the full tier list on demand */
  #legend:hover { max-height: 420px; height: auto; padding: 11px 15px; align-items: flex-start; display: block; }
  #legend:hover #legend-grid { display: grid; }
  #legend:hover #legend-header { display: none; }
  .legend-item { display: flex; align-items: center; gap: 7px; color: var(--text-dim); cursor: pointer; user-select: none; transition: opacity 0.12s ease, color 0.12s ease; }
  .legend-item:hover { color: var(--text); }
  .legend-item .swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .controls { position: absolute; bottom: 18px; left: 14px; display: flex; gap: 8px; }
  .btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    height: var(--ctrl-h); padding: 0 16px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer;
    font-family: var(--font-ui); font-weight: 600; letter-spacing: 0.005em;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-panel);
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  #branch-modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 1000;
    display: none; flex-direction: column;
  }
  #branch-modal.active { display: flex; }
  #branch-modal-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 16px 22px; background: var(--panel); border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  #branch-modal-header h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
  #branch-modal-desc { margin: 0; font-size: 13px; font-weight: 500; color: var(--text-dim); max-width: 640px; line-height: 1.5; }
  #branch-modal-header .close-btn {
    cursor: pointer; font-size: 20px; color: var(--text-dim); font-family: var(--font-ui); font-weight: 500; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: var(--radius-md); width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  #branch-modal-header .close-btn:hover { color: var(--text); border-color: var(--border-hover); background: rgba(255,255,255,0.05); }
  #branch-cy { flex: 1; position: relative; min-height: 0; }
</style>
</head>
<body>
  <div id="cy"></div>

  <div id="top-bar">
    <div id="title-box">
      <h1>Minecraft Progression Map</h1>
      <div class="subtitle">From Oak Log to the End</div>
    </div>
    <div id="top-right-controls">
      <div id="search-box">
        <span class="search-icon">&#8981;</span>
        <input id="search-input" type="text" placeholder="search..." />
      </div>
      <div id="menu-button" title="Menu">
        <span class="menu-icon">&#9776;</span>
      </div>
      <div id="menu-dropdown">
        <div class="menu-item" id="menu-option-1">Option 1</div>
        <div class="menu-item" id="menu-option-2">Option 2</div>
        <div class="menu-divider"></div>
        <div class="menu-credit">Made by Geo, Rishav &amp; Adwaith</div>
      </div>
    </div>
  </div>

  <div id="details-pane">
    <span class="close-btn" id="pane-close">&times;</span>
    <div id="details-pane-scroll">
      <div class="pane-header">
        <img id="pane-img" src="" alt=""/>
        <div>
          <h3 id="pane-title"></h3>
          <span class="tier-tag" id="pane-tier"></span>
        </div>
      </div>
      <p class="desc" id="pane-desc"></p>
      <div class="rel-title">Requires / obtained from</div>
      <div class="rel-list" id="pane-incoming"></div>
      <div class="rel-title">Leads to / unlocks</div>
      <div class="rel-list" id="pane-outgoing"></div>
      <div class="dbl-hint">Double-click this node to trace its full path from raw resources.</div>
    </div>
  </div>

  <div id="timeline-panel">
    <span class="close-btn" id="timeline-close">&times;</span>
    <div id="timeline-scroll">
      <h4 id="timeline-title">Path to ...</h4>
      <div id="timeline-list"></div>
    </div>
  </div>

  <div id="legend">
    <div id="legend-header">Tiers</div>
    <div id="legend-grid"></div>
  </div>

  <div class="controls">
    <button class="btn" id="fit-btn">Fit View</button>
  </div>

  <div id="branch-modal">
    <div id="branch-modal-header">
      <div>
        <h2 id="branch-modal-title"></h2>
        <p id="branch-modal-desc"></p>
      </div>
      <span class="close-btn" id="branch-modal-close">&times;</span>
    </div>
    <div id="branch-cy"></div>
  </div>

<script>
cytoscape.use(cytoscapeDagre);

var graphData = {"nodes": [{"data": {"id": "oak_log", "label": "Wood Log", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/oak_log.png", "tier": "wood", "desc": "Chop any tree to get logs. The very first resource in the game \u2014 everything begins here.", "color": "#8a6a4a", "degree": 1}}, {"data": {"id": "oak_planks", "label": "Wooden Planks", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/oak_planks.png", "tier": "wood", "desc": "Craft 1 log into 4 planks. The base building block for early tools and structures.", "color": "#8a6a4a", "degree": 3}}, {"data": {"id": "stick", "label": "Stick", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/stick.png", "tier": "wood", "desc": "2 planks (stacked) make 4 sticks. Used as handles for almost every tool and weapon.", "color": "#8a6a4a", "degree": 1}}, {"data": {"id": "crafting_table", "label": "Crafting Table", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/crafting_table_front.png", "tier": "wood", "desc": "4 planks in a square. Gives access to the full 3x3 crafting grid needed for tools, armor and more.", "color": "#8a6a4a", "degree": 6}}, {"data": {"id": "wooden_pickaxe", "label": "Wooden Pickaxe", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/wooden_pickaxe.png", "tier": "wood", "desc": "2 planks + 3... actually 3 planks + 2 sticks. The minimum tool needed to mine cobblestone.", "color": "#8a6a4a", "degree": 3}}, {"data": {"id": "wooden_axe", "label": "Wooden Axe", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/wooden_axe.png", "tier": "wood", "desc": "3 planks + 2 sticks. Doubles the speed of chopping wood.", "color": "#8a6a4a", "degree": 1}}, {"data": {"id": "wooden_sword", "label": "Wooden Sword", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/wooden_sword.png", "tier": "wood", "desc": "2 planks + 1 stick. A basic weapon for early defense.", "color": "#8a6a4a", "degree": 1}}, {"data": {"id": "wooden_shovel", "label": "Wooden Shovel", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/wooden_shovel.png", "tier": "wood", "desc": "1 plank + 2 sticks. Speeds up digging dirt, sand and gravel.", "color": "#8a6a4a", "degree": 1}}, {"data": {"id": "wooden_hoe", "label": "Wooden Hoe", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/wooden_hoe.png", "tier": "wood", "desc": "2 planks + 2 sticks. Tills dirt into farmland for planting crops.", "color": "#8a6a4a", "degree": 2}}, {"data": {"id": "farmland", "label": "Farmland & Crops", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/farmland.png", "tier": "food", "desc": "Till dirt with a hoe and plant seeds/wheat to start a renewable food supply.", "color": "#6fbf4f", "degree": 3}}, {"data": {"id": "wheat", "label": "Wheat", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/wheat.png", "tier": "food", "desc": "Harvested from farmland. Used to craft bread, breed cows/sheep, and feed villagers.", "color": "#6fbf4f", "degree": 4}}, {"data": {"id": "bread", "label": "Bread", "image": "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/bread.png", "tier": "food", "desc": "3 wheat = 1 bread. A cheap, reliable food source that restores hunger.", "color": "#6fbf4f", "degree": 1}}, {"data": {"id": "cobblestone", "label": "Cobbleston // ---- constellation layout: a hand-drawn-feeling alternative to a rigid tree
// (dagre) or chaotic physics (cose). High-degree "hub" items are strung along
// a single smooth wavy spine in rough progression order; everything else is
// scattered as a small dot-cloud around its nearest hub using a golden-angle
// spiral so satellites fan out evenly instead of clumping or needing a force
// simulation. Deterministic (seeded by node id) so it looks the same every
// time and re-running it is just a "recenter", not a reshuffle. ----
function hashCode(str){
  var h = 0;
  for (var i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function buildConstellationPositions(){
  var core = graphData.nodes.filter(function(n){ return n.data.kind !== 'root'; }).map(function(n){ return n.data; });
  var idSet = {}; core.forEach(function(n){ idSet[n.id] = true; });
  var adj = {}; core.forEach(function(n){ adj[n.id] = []; });
  graphData.edges.forEach(function(e){
    var s = e.data.source, t = e.data.target;
    if (idSet[s] && idSet[t]){ adj[s].push(t); adj[t].push(s); }
  });

  var LANDMARK_DEG = 6, HUB_DEG = 3;
  var hubs = core.filter(function(n){ return (n.degree || 0) >= HUB_DEG; }).map(function(n){ return n.id; });
  var hubSet = {}; hubs.forEach(function(id){ hubSet[id] = true; });

  // walk the main component from oak_log, recording hubs in discovery order
  // -> this becomes the left-to-right order of the spine
  var order = [];
  var visited = {};
  var startId = idSet['oak_log'] ? 'oak_log' : core[0].id;
  var mainQueue = [startId]; visited[startId] = true;
  while (mainQueue.length){
    var cur = mainQueue.shift();
    if (hubSet[cur]) order.push(cur);
    (adj[cur] || []).slice().sort().forEach(function(nb){
      if (!visited[nb]){ visited[nb] = true; mainQueue.push(nb); }
    });
  }
  hubs.forEach(function(id){ if (order.indexOf(id) === -1 && visited[id]) order.push(id); });

  var positions = {};
  var runningX = 0;
  order.forEach(function(id, i){
    var seed = hashCode(id);
    runningX += (i === 0 ? 0 : 132 + (seed % 5) * 14);
    var y = Math.sin(i * 0.6) * 130 + Math.sin(i * 1.7 + 1.3) * 40 + ((seed % 15) - 7);
    var deg = byId[id].degree || 0;
    positions[id] = { x: runningX, y: y, isLandmark: deg >= LANDMARK_DEG };
  });

  // nearest-hub + hop-distance for every other node in the main component
  var nearestHub = {}, dist = {};
  var q2 = [];
  hubs.forEach(function(id){ if (visited[id]){ nearestHub[id] = id; dist[id] = 0; q2.push(id); } });
  var qi = 0;
  while (qi < q2.length){
    var cur = q2[qi++];
    (adj[cur] || []).forEach(function(nb){
      if (visited[nb] && nearestHub[nb] === undefined){
        nearestHub[nb] = nearestHub[cur];
        dist[nb] = dist[cur] + 1;
        q2.push(nb);
      }
    });
  }

  var byHub = {};
  core.forEach(function(n){
    if (hubSet[n.id] || !visited[n.id]) return;
    var hub = nearestHub[n.id];
    if (!hub) return;
    (byHub[hub] = byHub[hub] || []).push(n.id);
  });
  var GOLDEN = 137.50776 * Math.PI / 180;
  Object.keys(byHub).forEach(function(hub){
    var hubPos = positions[hub];
    var list = byHub[hub].slice().sort(function(a, b){ return (dist[a] || 1) - (dist[b] || 1); });
    list.forEach(function(id, idx){
      var d = Math.max(1, dist[id] || 1);
      var ring = Math.min(d, 4);
      var angle = idx * GOLDEN + (hashCode(hub) % 100) / 100;
      var radius = 36 + ring * 30 + Math.min(idx, 14) * 6;
      positions[id] = { x: hubPos.x + Math.cos(angle) * radius, y: hubPos.y + Math.sin(angle) * radius };
    });
  });

  // a few items (pumpkin/melon/sea-pickle chains) aren't reachable from
  // oak_log at all -- drop each of those tiny orphan components in its own
  // little cluster below the main spine rather than losing them
  var remaining = core.filter(function(n){ return !visited[n.id]; });
  var placedOrphan = {};
  var orphanClusterIndex = 0;
  var maxMainY = Math.max.apply(null, order.map(function(id){ return positions[id].y; }).concat([0]));
  var floorY = maxMainY + 150;
  remaining.forEach(function(n){
    if (placedOrphan[n.id]) return;
    var comp = []; var q3 = [n.id]; var seen3 = {}; seen3[n.id] = true;
    while (q3.length){
      var cur = q3.shift();
      comp.push(cur);
      (adj[cur] || []).forEach(function(nb){
        if (!seen3[nb] && idSet[nb]){ seen3[nb] = true; q3.push(nb); }
      });
    }
    var anchorX = orphanClusterIndex * 110;
    var anchorY = floorY + (orphanClusterIndex % 2) * 55;
    comp.forEach(function(id, j){
      var angle = j * GOLDEN;
      var radius = 16 + j * 20;
      positions[id] = { x: anchorX + Math.cos(angle) * radius, y: anchorY + Math.sin(angle) * radius };
      placedOrphan[id] = true;
    });
    orphanClusterIndex++;
  });

  return positions;
}

function constellationPositionsWithLandmarks(){
  var positions = buildConstellationPositions();
  constellationLandmarks = {};
  Object.keys(positions).forEach(function(id){ if (positions[id].isLandmark) constellationLandmarks[id] = true; });
  return positions;
}

// ---- zoom-reactive sizing: nodes range from importance-scaled (degree-based)
// at the overview zoom level down to a single uniform size as the user zooms
// in, so the map reads like the illustration references (big hub nodes at a
// glance, even dots once you're in close). ----
var ANIM_DUR = 500;
var ANIM_EASE = 'ease-in-out-cubic';
// currentZoom/baseZoom are plain numbers (never touch the `cy` object) because
// the very first layout pass resolves node width/height *during* the
// `cytoscape({...})` constructor call, before the `cy` variable below is
// assigned - referencing cy.zoom() from inside a style function at that point
// throws and blanks the whole page.
var baseZoom = 1;
var currentZoom = 1;
function updateBaseZoom(){ currentZoom = cy.zoom(); baseZoom = currentZoom; updateLegendCollapse(); }
function sizeForZoom(deg, minDeg, maxDeg, minSize, maxSize, uniformSize){
  var raw = maxDeg > minDeg
    ? minSize + (Math.max(minDeg, Math.min(deg, maxDeg)) - minDeg) / (maxDeg - minDeg) * (maxSize - minSize)
    : (minSize + maxSize) / 2;
  var lo = baseZoom, hi = baseZoom * 4;
  var t = hi > lo ? (currentZoom - lo) / (hi - lo) : 0;
  t = Math.max(0, Math.min(1, t));
  var size = raw + (uniformSize - raw) * t;
  // Past the point where nodes have already converged to a uniform size (zoomed in
  // beyond 4x the fit-to-screen level), keep shrinking the model-space size as the
  // user zooms in further. Without this, on-screen node size just keeps growing
  // linearly with zoom and neighboring nodes end up overlapping close up. This does
  // NOT touch node positions/layout and has zero effect at or below the fit-to-screen
  // zoom level (currentZoom <= hi covers that, including the initial fit view).
  if (currentZoom > hi) {
    var shrink = Math.pow(hi / currentZoom, 0.55);
    shrink = Math.max(0.32, shrink);
    size = size * shrink;
  }
  return size;
}

        'color': 'data(color)',
        'text-valign': 'bottom',
        'text-halign': 'center',
        'text-margin-y': 5,
        'text-wrap': 'wrap',
        'text-max-width': 110,
        'text-outline-width': 0,
        'font-weight': 'bold',
        'z-index': 500
    }},
    { selector: 'node[kind = "root"].expanded', style: { 'border-style': 'solid', 'background-opacity': 0.42 } },
    { selector: 'node[kind = "root"].dimmed', style: { 'opacity': 0.5 } },
    { selector: 'node[kind = "root"].selected', style: { 'width': 104, 'height': 104 } },
    { selector: 'node[kind = "source"]', style: { 'shape': 'diamond', 'border-style': 'dashed', 'border-width': 2.5 } },
    { selector: 'node[kind = "mob"]', style: { 'shape': 'ellipse' } },
    { selector: 'edge[note = "expand"]', style: {
        'line-style': 'dashed', 'width': 3.4, 'line-color': 'data(color)', 'target-arrow-color': 'data(color)',
        'target-arrow-shape': 'triangle', 'arrow-scale': 1.1, 'curve-style': 'bezier'
    }},
    { selector: 'node.entrance-hidden', style: { 'opacity': 0 } },
    { selector: 'edge.entrance-hidden', style: { 'opacity': 0 } }
  ],
  layout: {
    name: 'preset',
    positions: (function(){ var pos = constellationPositionsWithLandmarks(); return function(node){ return pos[node.id()]; }; })(),
    fit: false
  },
  minZoom: 0.08,
  maxZoom: 4.5,
  wheelSensitivity: 0.25
});

// hide everything up front so the map can play a sequential emergence +
// pan-in animation on first load, before any hover/click interaction is
// possible -- purely additive (a class), so it never touches the opacity
// rules used by dimmed/highlighted/selected elsewhere.
cy.elements().addClass('entrance-hidden');

// re-resolve the functional width/height/font-size style values as the user
// zooms, so node sizing smoothly converges toward uniform on zoom-in
var zoomStyleQueued = false;
cy.on('zoom', function(){
  currentZoom = cy.zoom();
  if (zoomStyleQueued) return;
  zoomStyleQueued = true;
  requestAnimationFrame(function(){
    cy.style().update();
    zoomStyleQueued = false;
  });
  refreshNodeTexture();
  updateLegendCollapse();
});

// ---- legend: always sits as a compact "Tiers" tab in the corner so it
// doesn't cover the map -- hovering over it opens the full list on demand.
function updateLegendCollapse(){}

// ---- simple by default, textured on demand: the map opens with flat colour
// dots so the overall shape reads clearly, then reveals each item's actual
// icon once you zoom in close enough to appreciate it, or the moment you
// click/press a specific node to inspect it. The toolbar button is a full
// manual override for anyone who just wants one look all the time. ----
var TEXTURE_ZOOM_RATIO = 1.15;
var forceTextured = false; // manual override from the toolbar button
function refreshNodeTexture(){
  var autoTextured = (currentZoom / baseZoom) > TEXTURE_ZOOM_RATIO;
  var showTextured = forceTextured || autoTextured;
  cy.nodes().toggleClass('simple-node', !showTextured);
  // whatever is currently focused (a pinned node, a tier selection, a search
  // match) should always show its real icon, regardless of how zoomed in
  // the fit animation actually landed
  cy.nodes('.highlighted, .selected').removeClass('simple-node');
  if (pinned && pinned.cy && pinned.cy() === cy) pinned.removeClass('simple-node');
}

// make sure the whole progression map fits the window right away
// place each of the 3 expandable branch roots just outside its own anchor
// node -- offset a short distance from the anchor, in the direction away
// from the graph's centre -- so a branch always expands right next to the
// part of the tree it belongs to, instead of in one shared row far below
// the whole map (that was the old approach; it worked but put the crop
// branch, say, nowhere near "wheat" or "farmland").
var rootsPositioned = false;
function positionBranchRoots(){
  if (rootsPositioned) return;
  var core = cy.nodes('[kind != "root"]');
  if (core.length === 0) return;
  var box = core.boundingBox();
  var cx = (box.x1 + box.x2) / 2;
  var cy_ = (box.y1 + box.y2) / 2;
  var ROOT_OFFSET = 120;
  Object.keys(branchBundle.branches).forEach(function(key){
    var b = branchBundle.branches[key];
    var root = cy.getElementById(b.rootId);
    if (!root || root.empty()) return;
    var anchor = cy.getElementById(b.anchor);
    var ax = anchor.nonempty() ? anchor.position('x') : cx;
    var ay = anchor.nonempty() ? anchor.position('y') : box.y2 + 100;
    var dx = ax - cx, dy = ay - cy_;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ux = len > 1 ? dx / len : 0;
    var uy = len > 1 ? dy / len : 1;
    root.position({ x: ax + ux * ROOT_OFFSET, y: ay + uy * ROOT_OFFSET });
    root.data('ux', ux);
    root.data('uy', uy);
  });
  rootsPositioned = true;
  captureBase();
}

// one-time entrance: nodes fade in one after another sweeping left-to-right
// (roughly following the spine order), edges follow their endpoints in, and
// the camera settles into the fitted view from a touch further out. Runs
// once on load only -- "Reset Layout" and every other interaction are
// untouched since they never re-add the entrance-hidden class.
var entrancePlayed = false;
function playEntranceAnimation(){
  if (entrancePlayed) return;
  entrancePlayed = true;

  var nodes = cy.nodes().sort(function(a, b){ return a.position('x') - b.position('x'); });
  var order = {};
  nodes.forEach(function(n, i){ order[n.id()] = i; });
  var STEP = 7, CAP = 130, BASE = 90;

  nodes.forEach(function(n, i){
    setTimeout(function(){ n.removeClass('entrance-hidden'); }, BASE + Math.min(i, CAP) * STEP);
  });
  cy.edges().forEach(function(e){
    var i = Math.max(order[e.source().id()] || 0, order[e.target().id()] || 0);
    setTimeout(function(){ e.removeClass('entrance-hidden'); }, BASE + 60 + Math.min(i, CAP) * STEP);
  });

  // gentle pan-in on top of the emergence: start a little more zoomed out
  // and re-settle into the already-computed fitted view.
  var settledZoom = cy.zoom();
  var settledPan = cy.pan();
  cy.viewport({ zoom: settledZoom * 0.88, pan: { x: settledPan.x, y: settledPan.y - 26 } });
  cy.animate({ zoom: settledZoom, pan: settledPan }, { duration: 1000, easing: 'ease-out-cubic' });
}

cy.ready(function(){
  cy.nodes('[kind != "root"]').forEach(function(n){
    if (constellationLandmarks && constellationLandmarks[n.id()]) n.addClass('landmark');
  });
  cy.nodes().addClass('simple-node');
  positionBranchRoots();
  cy.fit(undefined, 40);
  updateBaseZoom();
  playEntranceAnimation();
});
cy.on('layoutstop', function(){
  if (!Object.keys(expandedBranches).some(function(k){ return expandedBranches[k]; })){
    positionBranchRoots();
    cy.fit(undefined, 40);
    updateBaseZoom();
  }
});

var pane = document.getElementById('details-pane');
var paneTitle = document.getElementById('pane-title');
var paneImg = document.getElementById('pane-img');
var paneDesc = document.getElementById('pane-desc');
var paneTier = document.getElementById('pane-tier');
var paneIncoming = document.getElementById('pane-incoming');
var paneOutgoing = document.getElementById('pane-outgoing');
var timelinePanel = document.getElementById('timeline-panel');
var timelineTitle = document.getElementById('timeline-title');
var timelineList = document.getElementById('timeline-list');
var pinned = null;

function edgeNote(edge){
  var n = edge.data('note');
  return n ? ' <span style="color:#555">(' + n + ')</span>' : '';
}

function renderPane(node){
  var d = node.data();
  paneTitle.innerText = d.label;
  paneImg.src = d.image;
  paneTier.innerText = tierLabels[d.tier] || d.tier;
  paneTier.style.background = tierColors[d.tier] || '#888';
  paneDesc.innerText = d.desc || '';

  var incoming = node.incomers('edge');
  var outgoing = node.outgoers('edge');

  paneIncoming.innerHTML = incoming.length ? incoming.map(function(e){
    var src = byId[e.data('source')];
    return '<div><span class="arrow req">&#8592;</span>' + src.label + edgeNote(e) + '</div>';
  }).join('') : '<div style="color:#555">Base resource</div>';

  paneOutgoing.innerHTML = outgoing.length ? outgoing.map(function(e){
    var tgt = byId[e.data('target')];
    return '<div><span class="arrow unlock">&#8594;</span>' + tgt.label + edgeNote(e) + '</div>';
  }).join('') : '<div style="color:#555">End of this path</div>';

  pane.classList.add('active');
}

function clearAll(){
  cy.elements().removeClass('dimmed highlighted selected edge-required edge-unlocks');
}

function focusNode(node){
  clearAll();
  cy.elements().addClass('dimmed');
  node.removeClass('dimmed').addClass('highlighted');
  var incomingEdges = node.incomers('edge');
  var outgoingEdges = node.outgoers('edge');
  incomingEdges.removeClass('dimmed').addClass('edge-required');
  outgoingEdges.removeClass('dimmed').addClass('edge-unlocks');
  node.incomers('node').removeClass('dimmed').addClass('highlighted');
  node.outgoers('node').removeClass('dimmed').addClass('highlighted');
}

function hideTimeline(){
  timelinePanel.classList.remove('active');
}

function topoSortChain(nodesColl, edgesColl){
  var ids = nodesColl.map(function(n){ return n.id(); });
  var idSet = {}; ids.forEach(function(id){ idSet[id] = true; });
  var inDeg = {}; ids.forEach(function(id){ inDeg[id] = 0; });
  var adj = {}; ids.forEach(function(id){ adj[id] = []; });
  edgesColl.forEach(function(e){
    var s = e.data('source'), t = e.data('target');
    if (idSet[s] && idSet[t]){ adj[s].push(t); inDeg[t] = (inDeg[t] || 0) + 1; }
  });
  var queue = ids.filter(function(id){ return inDeg[id] === 0; });
  var result = [];
  var seen = {};
  while (queue.length){
    queue.sort();
    var id = queue.shift();
    if (seen[id]) continue;
    seen[id] = true;
    result.push(id);
    (adj[id] || []).forEach(function(t){
      inDeg[t]--;
      if (inDeg[t] === 0) queue.push(t);
    });
  }
  ids.forEach(function(id){ if (!seen[id]) result.push(id); });
  return result.map(function(id){ return byId[id]; });
}

function showTimeline(node){
  var visited = {}; visited[node.id()] = true;
  var edgeIds = {};
  var frontier = [node];
  while (frontier.length){
    var n = frontier.pop();
    n.incomers('edge').forEach(function(e){
      edgeIds[e.id()] = true;
      var src = e.source();
      if (!visited[src.id()]){
        visited[src.id()] = true;
        frontier.push(src);
      }
    });
  }
  var chainNodes = cy.collection();
  Object.keys(visited).forEach(function(id){ chainNodes = chainNodes.union(cy.getElementById(id)); });
  var chainEdges = cy.collection();
  Object.keys(edgeIds).forEach(function(id){ chainEdges = chainEdges.union(cy.getElementById(id)); });

  clearAll();
  cy.elements().addClass('dimmed');
  chainNodes.removeClass('dimmed').addClass('highlighted');
  chainEdges.removeClass('dimmed').addClass('edge-required');
  node.addClass('selected');

  var order = topoSortChain(chainNodes, chainEdges);
  timelineTitle.innerText = 'Path to ' + node.data('label');
  timelineList.innerHTML = order.map(function(d, i){
    var isTarget = d.id === node.id();
    return '<div class="tl-step' + (isTarget ? ' tl-target' : '') + '">' +
      '<div class="tl-num">' + (i + 1) + '</div>' +
      '<img src="' + d.image + '"/>' +
      '<div class="tl-label">' + d.label + '</div>' +
    '</div>';
  }).join('');
  timelinePanel.classList.add('active');
}


// ---- branch networks now open in their own full-screen modal, each under
// its own header, instead of expanding inline into the main node system ----
function branchInfo(key){ return branchBundle.branches[key]; }

];

var branchCy = null;
var branchModal = document.getElementById('branch-modal');
// branch sub-system nodes always show their real texture -- no simple/zoom
// switching in here, unlike the main map (these networks are smaller and
// meant to be inspected closely, so the icons stay on the whole time).
function refreshBranchTexture(){}

function focusNodeIn(cyInst, node){
  cyInst.elements().removeClass('dimmed highlighted selected edge-required edge-unlocks');
  cyInst.elements().addClass('dimmed');
  node.removeClass('dimmed').addClass('highlighted');
  var incomingEdges = node.incomers('edge');
  var outgoingEdges = node.outgoers('edge');
  incomingEdges.removeClass('dimmed').addClass('edge-required');
  outgoingEdges.removeClass('dimmed').addClass('edge-unlocks');
  node.incomers('node').removeClass('dimmed').addClass('highlighted');
  node.outgoers('node').removeClass('dimmed').addClass('highlighted');
}

function closeBranchModal(){
  branchModal.classList.remove('active');
  pinned = null;
  pane.classList.remove('active');
  if (branchCy){ branchCy.destroy(); branchCy = null; }
  refreshNodeTexture();
}
document.getElementById('branch-modal-close').addEventListener('click', closeBranchModal);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && branchModal.classList.contains('active')) closeBranchModal();
});

function openBranchModal(rootNode){
  var key = rootNode.data('branchKey');
  var info = branchInfo(key);
  if (!info) return;

  pinned = null;
  clearAll();
  pane.classList.remove('active');
  hideTimeline();

  document.getElementById('branch-modal-title').innerText = info.rootLabelBase + ' (' + info.count + ')';
  document.getElementById('branch-modal-desc').innerText = info.desc || '';
  branchModal.classList.add('active');

  var els = { nodes: [], edges: [] };
  info.nodes.forEach(function(n){
    els.nodes.push({ data: Object.assign({}, n, { branchKey: key }) });
  });
  info.edges.forEach(function(e){
    // skip the synthetic links from the root hub itself -- the root node
    // isn't part of this modal's own graph, so an edge naming it would
    // reference a nonexistent node and crash the whole cytoscape build
    if (e.source === info.rootId || e.target === info.rootId) return;
    els.edges.push({ data: Object.assign({}, e, { id: key + '__' + e.source + '__' + e.target, branchKey: key }) });
  });

  if (branchCy) branchCy.destroy();
  branchCy = null;

  // the modal's container only just became display:flex above -- if we build
  // cytoscape in this same tick, it measures a 0x0 box before the browser has
  // painted the new layout and the whole graph ends up positioned off-canvas.
  // Waiting a frame lets that layout settle first.
  requestAnimationFrame(function(){
    if (!branchModal.classList.contains('active')) return; // closed again before this frame ran
    var container = document.getElementById('branch-cy');
    try {
      branchCy = cytoscape({
        container: container,
        elements: els,
        boxSelectionEnabled: false,
        autoungrabify: true,
        style: branchStyle,
        layout: {
          name: 'cose',
          animate: false,
          randomize: true,
          fit: true,
          padding: 40,
          nodeRepulsion: 9000,
          idealEdgeLength: 75,
          edgeElasticity: 90,
          nestingFactor: 5,
          gravity: 55,
          numIter: 1200,
          initialTemp: 220,
          coolingFactor: 0.95,
          minTemp: 1.0
        },
        minZoom: 0.08,
        maxZoom: 4.5,
        wheelSensitivity: 0.25
      });
    } catch (err){
      container.innerHTML = '<div style="padding:20px;color:#c93b3b;font-size:16px;">Could not build this network: ' + err.message + '</div>';
      return;
    }

    branchCy.ready(function(){
      branchCy.resize();
      branchCy.fit(undefined, 40);
    });
    branchCy.one('layoutstop', function(){
      branchCy.resize();
      branchCy.fit(undefined, 40);
    });

    branchCy.on('tap', 'node', function(e){
      var node = e.target;
      pinned = node;
      refreshBranchTexture();
      focusNodeIn(branchCy, node);
      renderPane(node);
    });
    branchCy.on('mouseover', 'node', function(e){
      if (pinned) return;
      focusNodeIn(branchCy, e.target);
      renderPane(e.target);
    });
    branchCy.on('mouseout', 'node', function(){
      if (pinned) return;
      branchCy.elements().removeClass('dimmed highlighted selected edge-required edge-unlocks');
      pane.classList.remove('active');
    });
    branchCy.on('tap', function(e){
      if (e.target === branchCy){
        pinned = null;
        refreshBranchTexture();
        branchCy.elements().removeClass('dimmed highlighted selected edge-required edge-unlocks');
        pane.classList.remove('active');
      }
    });
  });
}

cy.on('tap', 'node', function(e){
  var node = e.target;
  if (node.data('kind') === 'root'){
    openBranchModal(node);
    return;
  }
  pinned = node;
  refreshNodeTexture();
  hideTimeline();
  focusNode(node);
  node.addClass('selected');
  renderPane(node);
});

// ---- lively idle motion: nodes drift like floating Minecraft item drops ----
// (hashCode is defined earlier, next to buildConstellationPositions; basePositions/seeds
// are declared up near the top, before the cytoscape constructor - see comment there)
function captureBase(){
  cy.nodes().forEach(function(n){
    basePositions[n.id()] = { x: n.position('x'), y: n.position('y') };
    if (!seeds[n.id()]) seeds[n.id()] = hashCode(n.id());
  });
}
captureBase();
cy.on('layoutstop', captureBase);

var animStart = Date.now();
function driftLoop(){
  var t = (Date.now() - animStart) / 1000;
  cy.startBatch();
  cy.nodes().forEach(function(n){
    var base = basePositions[n.id()];
    if (!base) return;
    var seed = seeds[n.id()] || 1;
    var ampY = 3.6 + (seed % 5) * 0.9;
    var ampX = 2.0 + (seed % 3) * 0.7;
    var speedY = 0.5 + (seed % 7) / 16;
    var speedX = 0.32 + (seed % 5) / 18;
    var phase = (seed % 628) / 100;
    var dy = Math.sin(t * speedY + phase) * ampY + Math.sin(t * speedY * 2.3 + phase) * (ampY * 0.25);
    var dx = Math.cos(t * speedX + phase * 1.7) * ampX;
    n.position({ x: base.x + dx, y: base.y + dy });
  });
  cy.endBatch();
  requestAnimationFrame(driftLoop);
}
requestAnimationFrame(driftLoop);
