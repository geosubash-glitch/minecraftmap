<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Minecraft Progression Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    background-color: #0a0a0a; margin: 0; padding: 0;
    font-family: 'VT323', monospace;
    color: #e8e8e8; overflow: hidden;
  }
  #cy { width: 100vw; height: 100vh; display: block; }

  #top-bar {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #title-box { pointer-events: auto; }
  #title-box h1 {
    margin: 0; font-size: 26px; font-weight: 400; letter-spacing: 0.02em;
    text-shadow: 2px 2px 0 #000;
  }

  #search-box {
    pointer-events: auto;
    background: #141414; border: 2px solid #2c2c2c;
    border-radius: 3px; padding: 6px 10px;
  }
  #search-box input {
    background: transparent; border: none; outline: none; color: #e8e8e8;
    font-family: 'VT323', monospace; font-size: 18px; width: 190px;
  }
  #search-box input::placeholder { color: #555; }

  #details-pane {
    position: absolute; top: 70px; right: 14px; width: 300px; padding: 16px 18px;
    background: #141414;
    border: 2px solid #2c2c2c; border-radius: 3px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
  }
  #details-pane.active { opacity: 1; pointer-events: auto; }
  #details-pane .pane-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  #details-pane img { width: 44px; height: 44px; image-rendering: pixelated; flex-shrink: 0; }
  #details-pane h3 { margin: 0; font-size: 21px; font-weight: 400; }
  #details-pane .tier-tag {
    display: inline-block; margin-top: 3px; font-size: 13px;
    letter-spacing: 0.04em; padding: 1px 7px; border-radius: 2px; color: #0d0d0d; font-weight: 700;
  }
  #details-pane p.desc { font-size: 16px; line-height: 1.35; color: #c4c4c4; margin: 8px 0 10px; }
  #details-pane .rel-title { font-size: 13px; letter-spacing: 0.06em; color: #6a6a6a; margin: 10px 0 3px; text-transform: uppercase; }
  #details-pane .rel-list { font-size: 15px; line-height: 1.4; color: #b0b0b0; }
  #details-pane .rel-list span.arrow { margin-right: 4px; }
  #details-pane .close-btn {
    position: absolute; top: 8px; right: 10px; cursor: pointer; color: #555; font-size: 18px;
    pointer-events: auto; font-family: monospace;
  }
  #details-pane .close-btn:hover { color: #fff; }

  #legend {
    position: absolute; bottom: 18px; right: 14px;
    background: #141414; border: 2px solid #2c2c2c;
    border-radius: 3px; padding: 8px 12px;
    font-size: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: #999; cursor: pointer; user-select: none; }
  .legend-item.off { opacity: 0.3; }
  .legend-item .swatch { width: 9px; height: 9px; border-radius: 1px; display: inline-block; }

  .controls { position: absolute; bottom: 18px; left: 14px; display: flex; gap: 8px; }
  .btn {
    background: #141414; border: 2px solid #2c2c2c; color: #e8e8e8;
    padding: 6px 14px; border-radius: 3px; font-size: 16px; cursor: pointer;
    font-family: 'VT323', monospace; transition: all 0.12s ease;
  }
  .btn:hover { background: #232323; border-color: #444; }
</style>
</head>
<body>
  <div id="cy"></div>

  <div id="top-bar">
    <div id="title-box">
      <h1>Minecraft Progression Map</h1>
    </div>
    <div id="search-box">
      <input id="search-input" type="text" placeholder="search..." />
    </div>
  </div>

  <div id="details-pane">
    <span class="close-btn" id="pane-close">&times;</span>
    <div class="pane-header">
      <img id="pane-img" src="" alt=""/>
      <div>
        <h3 id="pane-title"></h3>
        <span class="tier-tag" id="pane-tier"></span>
      </div>
    </div>
    <p class="desc" id="pane-desc"></p>
    <div class="rel-title">Requires / obtained from</div>
    <div class="rel-list" id="pane-incoming"></div>
    <div class="rel-title">Leads to / unlocks</div>
    <div class="rel-list" id="pane-outgoing"></div>
  </div>

  <div id="legend"></div>

  <div class="controls">
    <button class="btn" id="fit-btn">Fit View</button>
    <button class="btn" id="layout-dagre-btn">Structured Flow</button>
    <button class="btn" id="layout-cose-btn">Organic Physics</button>
  </div>

var tierColors = {"wood": "#8a6a4a", "stone": "#8f8f8f", "iron": "#d8d8d8", "gold": "#e8c34a", "redstone": "#c93b3b", "diamond": "#5ad6d6", "nether": "#8a1f1f", "end": "#7a3fb0", "netherite": "#4a4141", "food": "#6fbf4f", "misc": "#4f7fbf"};
var tierLabels = {"wood": "Wood Age", "stone": "Stone Age", "iron": "Iron Age", "gold": "Gold", "redstone": "Redstone", "diamond": "Diamond", "nether": "The Nether", "end": "The End", "netherite": "Netherite", "food": "Food & Farming", "misc": "Misc / Trading"};

var byId = {};
graphData.nodes.forEach(function(n){ byId[n.data.id] = n.data; });

var cy = cytoscape({
  container: document.getElementById('cy'),
  elements: graphData,
  boxSelectionEnabled: false,
  autoungrabify: true,
  style: [
    {
      selector: 'node',
      style: {
        'shape': 'round-rectangle',
        'background-color': '#161616',
        'background-opacity': 1,
        'border-width': 2,
        'border-color': 'data(color)',
        'border-opacity': 0.5,
        'background-image': 'data(image)',
        'background-fit': 'contain',
        'background-clip': 'none',
        'width': 40,
        'height': 40,
        'label': 'data(label)',
        'color': '#999999',
        'text-valign': 'bottom',
        'text-margin-y': 7,
        'font-family': 'VT323, monospace',
        'font-size': '13px',
        'text-outline-color': '#0a0a0a',

      }
    },

    }},
    { selector: 'node.highlighted', style: { 'width': 56, 'height': 56, 'color': '#ffffff', 'border-width': 3, 'border-opacity': 1, 'opacity': 1 } },
    { selector: 'node.selected', style: { 'width': 60, 'height': 60, 'color': '#ffffff', 'border-width': 4, 'border-color': 'data(color)', 'border-opacity': 1 } },
    { selector: 'node.dimmed', style: { 'opacity': 0.12, 'color': '#333333' } },
    { selector: 'edge.highlighted', style: { 'width': 2.5, 'line-color': '#e8b34a', 'target-arrow-color': '#e8b34a', 'opacity': 1 } },
    { selector: 'edge.dimmed', style: { 'opacity': 0.04 } },
    { selector: 'node.tier-off', style: { 'display': 'none' } }
  ],
  layout: { name: 'dagre', rankDir: 'LR', nodeSep: 42, rankSep: 105 }
});

var pane = document.getElementById('details-pane');
var paneTitle = document.getElementById('pane-title');
var paneImg = document.getElementById('pane-img');
var paneDesc = document.getElementById('pane-desc');
var paneTier = document.getElementById('pane-tier');
var paneIncoming = document.getElementById('pane-incoming');
var paneOutgoing = document.getElementById('pane-outgoing');
var pinned = null;

function edgeNote(edge){
  var n = edge.data('note');
  return n ? ' <span style="color:#555">(' + n + ')</span>' : '';
}

function renderPane(node){
  var d = node.data();
  paneTitle.innerText = d.label;
  paneImg.src = d.image;
  paneTier.innerText = tierLabels[d.tier] || d.tier;
  paneTier.style.background = tierColors[d.tier] || '#888';
  paneDesc.innerText = d.desc || '';

  var incoming = node.incomers('edge');
  var outgoing = node.outgoers('edge');

  paneIncoming.innerHTML = incoming.length ? incoming.map(function(e){
    var src = byId[e.data('source')];
    return '<div><span class="arrow">&#8592;</span>' + src.label + edgeNote(e) + '</div>';
  }).join('') : '<div style="color:#555">Base resource</div>';

  paneOutgoing.innerHTML = outgoing.length ? outgoing.map(function(e){
    var tgt = byId[e.data('target')];
    return '<div><span class="arrow">&#8594;</span>' + tgt.label + edgeNote(e) + '</div>';
  }).join('') : '<div style="color:#555">End of this path</div>';

  pane.classList.add('active');
}

function highlightNode(node){
  var neighborhood = node.closedNeighborhood();
  cy.elements().addClass('dimmed').removeClass('highlighted');
  neighborhood.removeClass('dimmed').addClass('highlighted');
}

function clearHighlight(){
  cy.elements().removeClass('dimmed highlighted');
}

cy.on('tap', 'node', function(e){
  var node = e.target;
  pinned = node;
  cy.nodes().removeClass('selected');
  node.addClass('selected');
  highlightNode(node);
  renderPane(node);
});

cy.on('mouseover', 'node', function(e){
  if (pinned) return;
  highlightNode(e.target);
  renderPane(e.target);
});
cy.on('mouseout', 'node', function(){
  if (pinned) return;
  clearHighlight();
  pane.classList.remove('active');
});

cy.on('tap', function(e){
  if (e.target === cy){
    pinned = null;
    cy.nodes().removeClass('selected');
    clearHighlight();
    pane.classList.remove('active');
  }
});

document.getElementById('pane-close').addEventListener('click', function(){
  pinned = null;
  cy.nodes().removeClass('selected');
  clearHighlight();
  pane.classList.remove('active');
});

document.getElementById('fit-btn').addEventListener('click', function(){ cy.fit(undefined, 50); });
document.getElementById('layout-dagre-btn').addEventListener('click', function(){
  cy.layout({ name: 'dagre', rankDir: 'LR', nodeSep: 42, rankSep: 105, animate: true, animationDuration: 450 }).run();
});
document.getElementById('layout-cose-btn').addEventListener('click', function(){
  cy.layout({ name: 'cose', animate: true, animationDuration: 450 }).run();
});

// legend + tier filtering
var legendEl = document.getElementById('legend');
var offTiers = {};
Object.keys(tierColors).forEach(function(tier){
  var item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.tier = tier;
  item.innerHTML = '<span class="swatch" style="background:' + tierColors[tier] + '"></span>' + tierLabels[tier];
  item.addEventListener('click', function(){
    offTiers[tier] = !offTiers[tier];
    item.classList.toggle('off', offTiers[tier]);
    cy.nodes('[tier = "' + tier + '"]').toggleClass('tier-off', offTiers[tier]);
  });
  legendEl.appendChild(item);
});

// search
var searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  cy.nodes().removeClass('highlighted').removeClass('dimmed');
  if (!q){ return; }
  var matches = cy.nodes().filter(function(n){
    return n.data('label').toLowerCase().indexOf(q) !== -1;
  });
  if (matches.length){
    cy.elements().addClass('dimmed');
    matches.removeClass('dimmed').addClass('highlighted');
  }
});

// ---- lively idle motion: nodes drift like floating Minecraft item drops ----
function hashCode(str){
  var h = 0;
  for (var i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

var basePositions = {};
var seeds = {};
function captureBase(){
  cy.nodes().forEach(function(n){
    basePositions[n.id()] = { x: n.position('x'), y: n.position('y') };
    if (!seeds[n.id()]) seeds[n.id()] = hashCode(n.id());
  });
}
captureBase();
cy.on('layoutstop', captureBase);

var animStart = Date.now();
function driftLoop(){
  var t = (Date.now() - animStart) / 1000;
  cy.startBatch();
  cy.nodes().forEach(function(n){
    var base = basePositions[n.id()];
    if (!base) return;
    var seed = seeds[n.id()] || 1;
    var ampY = 2.2 + (seed % 5) * 0.6;
    var ampX = 1.2 + (seed % 3) * 0.5;
    var speedY = 0.35 + (seed % 7) / 22;
    var speedX = 0.22 + (seed % 5) / 26;
    var phase = (seed % 628) / 100;
    var dy = Math.sin(t * speedY + phase) * ampY + Math.sin(t * speedY * 2.3 + phase) * (ampY * 0.25);
    var dx = Math.cos(t * speedX + phase * 1.7) * ampX;
    n.position({ x: base.x + dx, y: base.y + dy });
  });
  cy.endBatch();
  requestAnimationFrame(driftLoop);
}
requestAnimationFrame(driftLoop);
</script>
